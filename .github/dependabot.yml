version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "no changelog"]
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "no changelog"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /deploy/fnm/*
    schedule:
      interval: weekly
    labels: ["dependencies", "no changelog"]
    groups:
      base-images:
        patterns: ["*"]
